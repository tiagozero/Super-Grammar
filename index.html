function searchIndex(){
  return allTopics().map(({ topic, section }) => {
    const lesson = state.lessons[topic.id];
    const parts = [
      topic.title, topic.description || "", topic.id, section.title,
      lesson ? (lesson.description || "") : ""
    ];
    (lesson && lesson.summary ? lesson.summary : []).forEach(r => {
      parts.push(r.pattern || "", r.form || "", r.use || "", r.example || "");
    });
    (lesson && lesson.sections ? lesson.sections : []).forEach(s => {
      parts.push(s.title || "");
      parts.push(Array.isArray(s.explanation) ? s.explanation.join(" ") : (s.explanation || ""));
      (s.examples || []).forEach(e => parts.push(e.sentence || ""));
    });
    getVocabularyFor(topic.id).forEach(w => {
      parts.push(w.term || "", w.definition || "", w.example || "");
      (w.synonyms || []).forEach(s => parts.push(s));
      (w.antonyms || []).forEach(s => parts.push(s));
    });
    getReadingFor(topic.id).forEach(p => {
      parts.push(p.title || "", p.context || "", p.text || "");
    });
    return { topic, section, hay: parts.join(" ").toLowerCase() };
  });
}

function renderBookResults(){
  const container = $("bookResults");
  if (!container) return;
  const q = norm(state.query);

  if (!q){
    container.innerHTML = sectionsHTML(allTopics(), true);
    return;
  }

  const items = searchIndex().filter(it => q.split(" ").every(term => it.hay.includes(term)));

  if (!items.length){
    container.innerHTML = `<div class="empty"><h3>No topics found</h3><p>Try a different word, or clear the search box.</p></div>`;
    return;
  }
  container.innerHTML = sectionsHTML(items, false);
}

function sectionsHTML(items, includeEmptySections){
  const b = currentBook();
  const groups = new Map();
  items.forEach(it => {
    if (!groups.has(it.section.id)) groups.set(it.section.id, { section: it.section, topics: [] });
    groups.get(it.section.id).topics.push(it.topic);
  });

  const list = [];
  ((b && b.sections) || []).forEach(sec => {
    const g = groups.get(sec.id);
    if (g) list.push(g);
    else if (includeEmptySections) list.push({ section: sec, topics: [] });
  });
  groups.forEach((g, id) => {
    if (!list.some(x => x.section.id === id)) list.push(g);
  });

  if (!list.length){
    return `<div class="empty">
      <h3>No sections yet</h3>
      <p>This book is empty. Add a section, then add topics inside it.</p>
      <button class="btn primary" data-action="add-section">＋ Add section</button>
    </div>`;
  }

  return list.map(({ section, topics }) => {
    const s = sectionStats(section);
    const cards = topics.length
      ? `<div class="topic-grid">${topics.map(t => topicCardHTML(t, section.id)).join("")}</div>`
      : `<div class="empty-section">
           <span>No topics in this section yet.</span>
           <button class="btn tiny" data-action="add-topic" data-section="${esc(section.id)}">＋ Add topic</button>
         </div>`;

    return `
    <section class="book-section">
      <div class="sec-head">
        <h3>${esc(section.title)}</h3>
        <div class="sec-progress">
          <div class="pbar small"><span style="width:${s.pct}%"></span></div>
          <span class="sec-meta">${s.completed} / ${s.total} topics completed</span>
        </div>
        <div class="sec-tools">
          <button class="icon-btn" data-action="add-topic" data-section="${esc(section.id)}" title="Add topic">＋</button>
          <button class="icon-btn" data-action="rename-section" data-section="${esc(section.id)}" title="Rename section">✎</button>
          <button class="icon-btn danger" data-action="delete-section" data-section="${esc(section.id)}" title="Delete section">✕</button>
        </div>
      </div>
      ${cards}
    </section>`;
  }).join("");
}

function topicCardHTML(topic, sectionId){
  const status = statusOf(topic.id);
  const lesson = state.lessons[topic.id];
  const gSets = grammarSetCount(topic.id);
  const vSets = vocabSetCount(topic.id);
  const vocabCount = importedVocabCount(topic.id);
  const readingCount = importedReadingCount(topic.id);

  const flags = [];
  if (lesson) flags.push("Lesson ✓");
  if (vocabCount) flags.push(vocabCount + " words");
  if (readingCount) flags.push(readingCount + " reading");
  if (gSets) flags.push(gSets + " ex. set" + (gSets === 1 ? "" : "s"));
  if (vSets) flags.push(vSets + " vocab set" + (vSets === 1 ? "" : "s"));
  const flagText = flags.length ? flags.join(" · ") : "No content";

  return `
  <article class="topic-card ${status}" tabindex="0" role="button"
           data-action="open-topic" data-id="${esc(topic.id)}"
           aria-label="Open ${esc(topic.title)}">
    <div class="topic-tools">
      <button class="icon-btn" data-action="edit-topic" data-id="${esc(topic.id)}"
              title="Edit topic" aria-label="Edit topic">✎</button>
      <button class="icon-btn danger" data-action="delete-topic" data-id="${esc(topic.id)}"
              data-section="${esc(sectionId || "")}" title="Delete topic" aria-label="Delete topic">✕</button>
    </div>
    <div class="topic-unit">Unit ${esc(topic.number != null ? topic.number : "—")}</div>
    <h4 class="topic-title">${esc(topic.title)}</h4>
    <p class="topic-desc">${esc(topic.description || (lesson && lesson.description) || "")}</p>
    <div class="topic-foot">
      <span class="pill ${status}">${statusLabel(status)}</span>
      <span class="topic-flag">${flagText}</span>
    </div>
  </article>`;
}

  const catOpts = [`<option value="">All categories</option>`];

    `${total} word${total === 1 ? "" : "s"} saved` +
    (sources.size ? ` from ${sources.size} topic${sources.size === 1 ? "" : "s"}` : "") +
    `. Add words from any lesson's Vocabulary section, then review, filter or export them here.`;
}

/* ---------------------------------------------------------------------------
   19. LESSON VIEW
   --------------------------------------------------------------------------- */
function lessonHTML(id){
  const found = findTopic(id);
  if (!found){
    return `<div class="empty"><h3>Topic not found</h3>
      <p>This topic is not part of the current book.</p>
      <button class="btn" data-action="nav" data-view="book">Back to Books</button></div>`;
  }
  const { topic, section } = found;
  const lesson = state.lessons[id];
  const status = statusOf(id);
  const nav = neighborTopics(id);

  let html = `
  <article class="lesson">
    <div class="lesson-head">
      <div class="unit-label">Unit ${esc(topic.number != null ? topic.number : "—")} · ${esc(section.title)}</div>
      <h1 class="lesson-title">${esc(lesson ? lesson.title : topic.title)}</h1>
      <p class="lesson-desc">${esc((lesson && lesson.description) || topic.description || "")}</p>
      <div class="lesson-meta">
        <span class="pill ${status}" id="lessonPill">${statusLabel(status)}</span>
        <button class="btn ${status === "completed" ? "ok" : "primary"}"
                data-action="toggle-complete" data-id="${esc(id)}" id="lessonCompleteBtn">
          ${status === "completed" ? "↺ Mark as not completed" : "✓ Mark as completed"}
        </button>
        <label class="btn">
          ${hasTopicContent(id) ? "Replace from JSON" : "Import lesson JSON"}
          <input type="file" class="lesson-file-input" accept=".json,application/json" multiple hidden>
        </label>
        <button class="btn ghost" data-action="toggle-paste" data-target="lesson-paste-wrap"
                data-label-show="⌨ Paste JSON" data-label-hide="▾ Hide paste box">⌨ Paste JSON</button>
        ${hasTopicContent(id) ? `<button class="btn ghost" data-action="export-lesson" data-id="${esc(id)}">Export lesson JSON</button>` : ""}
        <button class="btn ghost" data-action="toggle-reader">
          Aa ${state.readerOpen ? "Hide options" : "Reading options"}
        </button>
      </div>
      <div class="paste-wrap" id="lesson-paste-wrap" hidden>
        <textarea class="paste" id="lesson-paste"
                  placeholder='{ "id": "${esc(id)}", "title": "...", "lesson": { "sections": [] }, "vocabulary": { "words": [], "exercises": [] }, "reading": { "passages": [] } }'></textarea>
        <div class="file-row">
          <button class="btn primary" data-action="import-lesson-paste"
                  data-topic="${esc(id)}" data-target="lesson-paste">Import pasted JSON</button>
          <span class="muted"><code>id</code> and <code>title</code> are filled in automatically when missing.</span>
        </div>
      </div>
      ${readerPanelHTML(state.readerOpen === true)}
    </div>`;

  html += tocHTML(lesson, id);
  html += lesson ? lessonContentHTML(lesson) : noLessonHTML(topic, hasTopicContent(id));
  html += vocabularyHTML(id);
  html += readingHTML(id);
  html += exercisesBlockHTML(id);

  html += `
    <nav class="lesson-nav">
      <button class="btn ghost" data-action="prev-topic" data-id="${esc(id)}" ${nav.prev ? "" : "disabled"}>
        ← ${nav.prev ? esc(shortTitle(nav.prev.title)) : "Previous Topic"}
      </button>
      <span class="mid">
        <button class="btn" data-action="nav" data-view="book-detail">Back to book</button>
      </span>
      <button class="btn ghost" data-action="next-topic" data-id="${esc(id)}" ${nav.next ? "" : "disabled"}>
        ${nav.next ? esc(shortTitle(nav.next.title)) : "Next Topic"} →
      </button>
    </nav>
  </article>`;

  return html;
}

function shortTitle(t){
  return String(t).length > 26 ? String(t).slice(0, 24) + "…" : t;
}

function tocHTML(lesson, topicId){
  const items = [];

  if (lesson && Array.isArray(lesson.sections)){
    lesson.sections.forEach((s, i) => {
      items.push(`<li><a href="#sec-${esc(s.id || i + 1)}">${esc(s.title || "Section " + (i + 1))}</a></li>`);
    });
  }

  items.push(`<li><a href="#lesson-vocabulary">Vocabulary</a></li>`);
  items.push(`<li><a href="#lesson-reading">Reading</a></li>`);
  items.push(`<li><a href="#lesson-exercises">Exercises</a></li>`);

  return `<nav class="toc" aria-label="Lesson contents">
    <div class="toc-title">Contents</div>
    <ol>${items.join("")}</ol>
  </nav>`;
}

function noLessonHTML(topic, hasOther){
  const tplId = "lessonTpl-" + slugify(topic.id);
  const boxId = tplId + "-box";
  const tplText = JSON.stringify(lessonTemplateForTopic(topic.id), null, 2);

  return `
  <div class="card empty-lesson">
    <h3>${hasOther ? "No lesson text loaded" : "Lesson content not loaded"}</h3>
    <p class="muted">${hasOther
      ? "This topic has vocabulary, reading or exercises, but no <code>lesson.sections</code> yet."
      : "The book lists this topic, but its lesson JSON has not been imported yet."}
      One JSON file holds the lesson, exercises, vocabulary, vocabulary exercises and reading.</p>
    <p class="muted">Expected file name: <code>${esc(topic.id)}.json</code></p>
    <div class="file-row">
      <label class="btn primary">
        Import lesson JSON
        <input type="file" class="lesson-file-input" accept=".json,application/json" multiple hidden>
      </label>
      <button class="btn" data-action="toggle-template" data-target="${esc(tplId)}"
              data-label-show="▸ Show lesson template" data-label-hide="▾ Hide lesson template">
        ▸ Show lesson template
      </button>
      <button class="btn ghost" data-action="download-template" data-kind="lesson" data-id="${esc(topic.id)}">
        Download as JSON file
      </button>
      <button class="btn ghost" data-action="nav" data-view="settings">Go to Settings</button>
    </div>

    <div class="template-wrap" id="${esc(tplId)}" hidden>
      <p class="muted" style="margin-top:14px;">
        This template is pre-filled with the <code>id</code>, <code>title</code>,
        <code>section</code> and <code>number</code> for <strong>${esc(topic.title)}</strong>.
        Keep only the parts you need: <code>lesson</code>, <code>vocabulary</code>
        (words + exercises) and <code>reading</code>. Import the file, or use <em>Paste JSON</em> above.
      </p>
      <div class="template-box" id="${esc(boxId)}">${esc(tplText)}</div>
      <div class="file-row">
        <button class="btn tiny" data-action="copy-template" data-target="${esc(boxId)}">Copy JSON</button>
        <button class="btn tiny ghost" data-action="download-template" data-kind="lesson" data-id="${esc(topic.id)}">
          Download
        </button>
      </div>
    </div>
  </div>`;
}

function lessonContentHTML(lesson){
  let html = "";
  (lesson.sections || []).forEach((s, i) => { html += sectionHTML(s, i, lesson); });
  if (lesson.comparisons && lesson.comparisons.length) html += comparisonsHTML(lesson.comparisons);
  if (lesson.summary && lesson.summary.length)         html += summaryHTML(lesson.summary);
  return html;
}

function sectionHTML(s, index, lesson){
  const num = index + 1;
  const secId = s.id || ("sec" + num);
  let h = `<section class="lsection" id="sec-${esc(secId)}">
    <h2 class="lsection-title"><span class="sec-num">${num}</span>${esc(s.title || "Section " + num)}</h2>`;

  if (s.explanation) h += `<div class="explanation">${paragraphs(s.explanation)}</div>`;
  if (s.context)     h += `<div class="context-box"><span class="context-label">Context</span>${esc(s.context)}</div>`;
  if (s.examples && s.examples.length) h += examplesHTML(s.examples);
  if (s.mistakes && s.mistakes.length) h += mistakesHTML(s.mistakes);
  h += literaryHTML(s, lesson, index);
  h += `</section>`;
  return h;
}

function examplesHTML(examples){
  return `<div class="example-box">
    <div class="example-label">Examples</div>
    <ul class="example-list">
      ${examples.map(e => `<li>${highlight(e.sentence, e.target)}
        ${e.note ? `<span class="ex-note">${esc(e.note)}</span>` : ""}</li>`).join("")}
    </ul>
  </div>`;
}

function mistakesHTML(mistakes){
  return `<div class="mistakes">
    <div class="mistakes-label">Common mistakes</div>
    ${mistakes.map(m => `<div class="mistake-row">
      <span class="wrong">${esc(m.wrong)}</span> → <span class="right">${esc(m.right)}</span>
      ${m.why ? `<span class="why">${esc(m.why)}</span>` : ""}
    </div>`).join("")}
  </div>`;
}

function literaryHTML(section, lesson, sectionIndex){
  const list = section.literary_examples || [];

  if (!list.length){
    return `<div class="lit-none">No verified literary example available for this section.</div>`;
  }

  return list.map((L, li) => {
    const key = `${lesson.id}::${section.id || sectionIndex}::${li}`;
    passageStore.set(key, {
      passage: L.passage || "",
      book: L.book || "",
      author: L.author || "",
      url: L.url || "",
      context: L.context || "",
      targets: L.target_instances || []
    });

    return `<figure class="literary-card">
      <div class="lit-head">
        <div>
          <div class="lit-book">${esc(L.book || "")}</div>
          <div class="lit-author">${esc(L.author || "")}</div>
        </div>
        ${L.url ? `<a class="lit-link" href="${esc(L.url)}" target="_blank" rel="noopener noreferrer">Project Gutenberg ↗</a>` : ""}
      </div>
      ${L.context ? `<div class="lit-context"><span class="lit-label">Context</span>${esc(L.context)}</div>` : ""}
      <blockquote class="lit-passage">${passageHTML(L.passage, L.target_instances || [])}</blockquote>
      ${L.analysis ? `<div class="lit-analysis"><span class="lit-label">Grammar analysis</span>${esc(L.analysis)}</div>` : ""}
      <button class="btn ghost" data-action="open-passage" data-key="${esc(key)}">Read complete passage</button>
    </figure>`;
  }).join("");
}

function comparisonsHTML(comparisons){
  return `<section class="lesson-block">
    <h2 class="block-title">Comparison</h2>
    ${comparisons.map(c => {
      let l1 = "Structure 1", l2 = "Structure 2";
      if (c.title && c.title.indexOf(" vs ") > -1){
        const parts = c.title.split(" vs ");
        l1 = parts[0].trim();
        l2 = parts.slice(1).join(" vs ").trim();
      }
      l1 = c.label_1 || l1;
      l2 = c.label_2 || l2;
      return `<div class="card">
        <h3 class="cmp-title">${esc(c.title || "")}</h3>
        <div class="table-scroll">
          <table class="tbl cmp-table">
            <thead><tr><th>Feature</th><th>${esc(l1)}</th><th>${esc(l2)}</th></tr></thead>
            <tbody>
              ${(c.rows || []).map(r => `<tr>
                <td class="feat">${esc(r.feature || "")}</td>
                <td>${highlight(r.structure_1 || "", r.target_1 || [])}</td>
                <td>${highlight(r.structure_2 || "", r.target_2 || [])}</td>
              </tr>`).join("")}
            </tbody>
          </table>
        </div>
      </div>`;
    }).join("")}
  </section>`;
}

function summaryHTML(summary){
  return `<section class="lesson-block">
    <h2 class="block-title">Summary</h2>
    <div class="card">
      <div class="table-scroll">
        <table class="tbl summary-table">
          <thead><tr><th>Pattern</th><th>Form</th><th>Use</th><th>Example</th></tr></thead>
          <tbody>
            ${summary.map(r => `<tr>
              <td class="pat">${esc(r.pattern || "")}</td>
              <td class="form">${esc(r.form || "")}</td>
              <td>${esc(r.use || "")}</td>
              <td class="ex">${highlight(r.example || "", r.target || [])}</td>
            </tr>`).join("")}
          </tbody>
        </table>
      </div>
    </div>
  </section>`;
}

/* ---------------------------------------------------------------------------
   19b. VOCABULARY BLOCK
   --------------------------------------------------------------------------- */
function vocabCardHTML(w, opts){
  opts = opts || {};

  const pos = w.part_of_speech
    ? `<span class="vocab-pos">${esc(w.part_of_speech)}</span>` : "";
  const pron = w.pronunciation
    ? `<span class="vocab-pron">${esc(w.pronunciation)}</span>` : "";
  const def = w.definition
    ? `<div class="vocab-def">${esc(w.definition)}</div>` : "";
  const ex = w.example
    ? `<div class="vocab-ex"><span class="vocab-ex-label">Example</span>${esc(w.example)}</div>` : "";
  const syn = (w.synonyms && w.synonyms.length)
    ? `<span class="vocab-syn"><strong>Syn.</strong>${esc(w.synonyms.join(", "))}</span>` : "";
  const ant = (w.antonyms && w.antonyms.length)
    ? `<span class="vocab-ant"><strong>Ant.</strong>${esc(w.antonyms.join(", "))}</span>` : "";
  const meta = (syn || ant) ? `<div class="vocab-meta">${syn}${ant}</div>` : "";
  const note = w.notes ? `<div class="vocab-note">${esc(w.notes)}</div>` : "";
  const tags = (w.tags && w.tags.length)
    ? `<div class="vocab-tags">${w.tags.map(t => `<span class="vocab-tag">${esc(t)}</span>`).join("")}</div>`
    : "";

  let source = "";
  if (opts.showSource && w.source){
    const found = findTopicWithBook(w.source);
    if (found){
      const title = found.topic.title || w.source;
      const bk = found.book ? bookTitle(found.book) : "";
      source = `<div class="vocab-source" title="${esc(w.source)}">
        <span class="vocab-source-label">From</span>
        <span class="vocab-source-title">${esc(title)}</span>
        ${bk ? `<span class="vocab-source-book">· ${esc(bk)}</span>` : ""}
      </div>`;
    } else {
      source = `<div class="vocab-source" title="${esc(w.source)}">
        <span class="vocab-source-label">From</span>
        <span class="vocab-source-title vocab-source-id">${esc(w.source)}</span>
      </div>`;
    }
  }

  let control = "";
  if (opts.selectable){
    control = `<label class="vocab-select" title="Select this word">
        <input type="checkbox" class="vocab-check" data-index="${esc(opts.index)}">
      </label>`;
  } else if (opts.removable){
    control = `<button type="button" class="vocab-remove"
                 data-action="bank-remove" data-key="${esc(opts.bankKey || "")}"
                 title="Remove from the Vocabulary Bank"
                 aria-label="Remove from the Vocabulary Bank">✕</button>`;
  }

  const cls = "vocab-card"
    + (opts.selectable ? " selectable" : "")
    + (opts.removable  ? " bank" : "");

  return `<article class="${cls}">
    ${control}
    <header class="vocab-head">
      <div class="vocab-term-line">
        <span class="vocab-term">${esc(w.term || "")}</span>
        ${pos}
      </div>
      ${pron}
    </header>
    ${def}
    ${ex}
    ${meta}
    ${note}
    ${tags}
    ${source}
  </article>`;
}

function vocabToolbarHTML(topicId){
  return `<div class="vocab-grid-toolbar">
    <label class="vocab-select-all">
      <input type="checkbox" data-action="vocab-select-all" data-topic="${esc(topicId)}">
      <span>Select all</span>
    </label>
    <span class="vgt-spacer"></span>
    <button class="btn tiny primary" data-action="bank-add-selected" data-topic="${esc(topicId)}">
      ＋ Add selected to Bank
    </button>
    <button class="btn tiny" data-action="bank-add-all" data-topic="${esc(topicId)}">
      ＋ Add all to Bank
    </button>
    <button class="btn tiny ghost" data-action="bank-export-selected" data-topic="${esc(topicId)}">
      ⭳ CSV (selected)
    </button>
    <button class="btn tiny ghost" data-action="bank-export-all" data-topic="${esc(topicId)}">
      ⭳ CSV (all)
    </button>
  </div>`;
}

function vocabularyHTML(topicId){
  const words = getVocabularyFor(topicId);
  const n = words.length;
  const gridId = "vocab-grid-" + slugify(topicId);

  let html = `<section class="lesson-block" id="lesson-vocabulary">
    <h2 class="block-title">
      <span>Vocabulary</span>
      <span class="exercise-count">${n} word${n === 1 ? "" : "s"}</span>
    </h2>`;

  if (n){
    html += vocabToolbarHTML(topicId);
    html += `<div class="vocab-grid" id="${esc(gridId)}">${
      words.map((w, i) => vocabCardHTML(w, { selectable: true, index: i })).join("")
    }</div>`;
  } else {
    html += `<div class="lit-none">No vocabulary loaded for this topic yet.</div>`;
  }

  if (n){
    html += `<div class="exercise-import-bar">
      <div class="exercise-import-note">
        <strong>${esc(topicId)}</strong><br>
        ${n} word${n === 1 ? "" : "s"} from the lesson JSON.
      </div>
      <button class="btn ghost" data-action="clear-vocabulary" data-id="${esc(topicId)}">Clear vocabulary</button>
    </div>`;
  }

  html += vocabularyExercisesHTML(topicId);

  html += `</section>`;
  return html;
}

/* ---------------------------------------------------------------------------
   19c. EXERCISE SET GRID — shared by grammar + vocabulary
   --------------------------------------------------------------------------- */
/**
 * Card grid showing every exercise set of a topic, with a card for
 * "add set" that opens the file picker for multiple JSON files.
 */
function exerciseSetGridHTML(topicId, kind){
  const sets = getExerciseSets(topicId, kind);
  const activeId = ensureActiveSetId(topicId, kind);
  const label = kind === "vocabulary" ? "vocabulary exercise" : "exercise";

  const cards = sets.map(s => exSetCardHTML(topicId, kind, s, s.id === activeId)).join("");

  return `<div class="ex-set-grid">
    ${cards}
    <label class="ex-set-add" title="Add one or more JSON files as new sets">
      <span class="plus">＋</span>
      <span class="lbl">Add ${label} set</span>
      <input type="file" class="ex-file-input" accept=".json,application/json" multiple hidden
             data-topic="${esc(topicId)}" data-kind="${esc(kind)}">
    </label>
  </div>`;
}

function exSetCardHTML(topicId, kind, set, isActive){
  const n = Array.isArray(set.exercises) ? set.exercises.length : 0;
  const countLabel = `${n} ${kind === "vocabulary" ? "vocab " : ""}exercise${n === 1 ? "" : "s"}`;
  const src = set.source && set.source !== "lesson" && set.source !== "legacy"
    ? set.source
    : (set.source === "lesson" ? "from lesson bundle" : "");

  return `<div class="ex-set-card${isActive ? " active" : ""}"
                role="button" tabindex="0"
                data-action="select-ex-set"
                data-topic="${esc(topicId)}" data-kind="${esc(kind)}" data-set="${esc(set.id)}"
                title="Open this set">
    <button type="button" class="icon-btn danger ex-set-del"
            data-action="delete-ex-set"
            data-topic="${esc(topicId)}" data-kind="${esc(kind)}" data-set="${esc(set.id)}"
            title="Delete this set" aria-label="Delete this set">✕</button>
    <span class="ex-set-name">${esc(set.name || "Untitled set")}</span>
    <span class="ex-set-meta">${esc(countLabel)}</span>
    ${src ? `<span class="ex-set-src" title="${esc(src)}">${esc(src)}</span>` : ""}
  </div>`;
}

/* ---------------------------------------------------------------------------
   19d. VOCABULARY EXERCISES BLOCK
   --------------------------------------------------------------------------- */
function vocabularyExercisesHTML(topicId){
  const kind = "vocabulary";
  const sets = getExerciseSets(topicId, kind);
  const activeSet = getActiveExerciseSet(topicId, kind);
  const exercises = activeSet && Array.isArray(activeSet.exercises) ? activeSet.exercises : [];
  const n = exercises.length;

  const hidden = !!state.prefs.hideVocabExercises;
  const bodyId = "vocab-ex-body-" + slugify(topicId);

  let html = `<h3 class="sub-block-title">
    <span>Vocabulary exercises</span>
    <span class="exercise-count">${sets.length} set${sets.length === 1 ? "" : "s"}${n ? " · " + n + " shown" : ""}</span>
    <button class="btn ghost tiny block-toggle" data-action="toggle-block"
            data-block="vocab-exercises" data-target="${esc(bodyId)}"
            aria-expanded="${hidden ? "false" : "true"}">${hidden ? "▸ Show" : "▾ Hide"}</button>
  </h3>
  <div id="${esc(bodyId)}" ${hidden ? "hidden" : ""}>`;

  html += exerciseSetGridHTML(topicId, kind);

  if (sets.length && activeSet){
    html += `<p class="ex-set-active-label">Showing <strong>${esc(activeSet.name)}</strong> · ${n} exercise${n === 1 ? "" : "s"}</p>`;
  }

  if (n){
    html += `<div class="exercises">
      ${exercises.map((ex, i) => exerciseHTML(ex, i, topicId, "vocabulary")).join("")}
    </div>`;
  } else if (!sets.length){
    html += `<div class="lit-none">No vocabulary exercises loaded yet. Use <strong>＋ Add vocabulary exercise set</strong> above to import one or more JSON files.</div>`;
  } else {
    html += `<div class="lit-none">This set is empty.</div>`;
  }

  html += `</div>`;
  return html;
}

/* ---------------------------------------------------------------------------
   19e. READING BLOCK
   --------------------------------------------------------------------------- */
function readingPassageHTML(p, index){
  const head = `<div class="lit-head">
      <div>
        <div class="lit-book">${esc(p.title || ("Passage " + (index + 1)))}</div>
        <div class="lit-author">${esc([p.author, p.source].filter(Boolean).join(" · "))}</div>
      </div>
      ${p.url ? `<a class="lit-link" href="${esc(p.url)}" target="_blank" rel="noopener noreferrer">Source ↗</a>` : ""}
    </div>`;

  const context = p.context
    ? `<div class="lit-context"><span class="lit-label">Context</span>${esc(p.context)}</div>` : "";

  const text = `<blockquote class="lit-passage">${passageHTML(p.text || "", p.target_instances || [])}</blockquote>`;

  const glossary = (Array.isArray(p.glossary) && p.glossary.length)
    ? `<div class="glossary-box">
         <span class="lit-label">Glossary</span>
         <ul class="glossary-list">
           ${p.glossary.map(g => `<li><span class="gl-term">${esc(g.term || "")}</span> — ${esc(g.definition || "")}</li>`).join("")}
         </ul>
       </div>` : "";

  const questions = (Array.isArray(p.questions) && p.questions.length)
    ? `<div class="questions-box">
         <span class="lit-label">Comprehension</span>
         ${p.questions.map(q => `<div class="reading-q">
            <div class="rq-q">${esc(q.question || "")}</div>
            ${q.answer ? `<button type="button" class="btn ghost tiny" data-action="reveal-answer">Show answer</button>
              <div class="rq-a">${esc(q.answer)}</div>` : ""}
         </div>`).join("")}
       </div>` : "";

  return `<figure class="literary-card reading-card">${head}${context}${text}${glossary}${questions}</figure>`;
}

function readingHTML(topicId){
  const passages = getReadingFor(topicId);
  const n = passages.length;
  const bodyId      = "reading-body-" + slugify(topicId);

  let html = `<section class="lesson-block" id="lesson-reading">
    <h2 class="block-title">
      <span>Reading</span>
      <span class="exercise-count">${n} passage${n === 1 ? "" : "s"}</span>
      <button class="btn ghost tiny block-toggle" data-action="toggle-block"
              data-block="reading" data-target="${esc(bodyId)}"
              aria-expanded="true">▾ Hide</button>
    </h2>
    <div id="${esc(bodyId)}">`;

  if (n){
    html += passages.map((p, i) => readingPassageHTML(p, i)).join("");
  } else {

function exerciseHTML(ex, i, lessonId, bank){
  const type = ex.type || "multiple_choice";
  const b = bank || "grammar";
  if (type === "multiple_choice")      return mcHTML(ex, i, b);
  if (type === "fill_blank")           return fillHTML(ex, i, b);
  if (type === "matching_definition")  return matchHTML(ex, i, lessonId, b);
  return `<div class="exercise" data-ex="${i}" data-bank="${esc(b)}">
    <div class="ex-feedback err">Unsupported exercise type: <strong>${esc(type)}</strong></div>
  </div>`;
}

function mcHTML(ex, i, bank){
  return `<div class="exercise" data-ex="${i}" data-bank="${esc(bank)}" data-type="multiple_choice">
    <div class="ex-head"><span class="ex-num">${i + 1}</span><span class="ex-type">Multiple choice</span></div>
    <p class="ex-question">${esc(ex.question || ex.sentence || "")}</p>
    <div class="options">
      ${(ex.options || []).map((o, oi) =>
        `<button type="button" class="option" data-oi="${oi}">${esc(o)}</button>`).join("")}
    </div>
    <div class="ex-actions"><button class="btn" data-action="check-exercise">Check answer</button></div>
    <div class="ex-feedback" hidden></div>
  </div>`;
}

function fillHTML(ex, i, bank){
  const sentence = ex.sentence || ex.question || "";
  const parts = String(sentence).split("{{blank}}");
  const blanks = parts.length - 1;

  let body = "";
  parts.forEach((p, pi) => {
    body += esc(p);
    if (pi < blanks){
      body += `<input class="blank-input" data-bi="${pi}" autocomplete="off" spellcheck="false" aria-label="Answer ${pi + 1}">`;
    }
  });

  return `<div class="exercise" data-ex="${i}" data-bank="${esc(bank)}" data-type="fill_blank">
    <div class="ex-head"><span class="ex-num">${i + 1}</span><span class="ex-type">Fill in the blank</span></div>
    <p class="ex-question fill-sentence">${body}</p>
    <div class="ex-actions"><button class="btn" data-action="check-exercise">Check answer</button></div>
    <div class="ex-feedback" hidden></div>
  </div>`;
}

function matchOrder(key, n){
  if (!matchOrders[key] || matchOrders[key].length !== n){
    const a = [...Array(n).keys()];
    for (let i = a.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    matchOrders[key] = a;
  }
  return matchOrders[key];
}

function matchHTML(ex, i, lessonId, bank){
  const pairs = ex.pairs || [];
  const setId = getActiveSetId(lessonId, bank) || "default";
  const order = matchOrder(`${lessonId}:${bank}:${setId}:${i}`, pairs.length);

  return `<div class="exercise" data-ex="${i}" data-bank="${esc(bank)}" data-type="matching_definition">
    <div class="ex-head"><span class="ex-num">${i + 1}</span><span class="ex-type">Matching</span></div>
    <p class="ex-question">${esc(ex.question || "Match each item with its definition.")}</p>
    <div class="match-grid">
      ${pairs.map((p, pi) => `<div class="match-row">
        <div class="match-term">${esc(p.term)}</div>
        <select class="match-select" data-mi="${pi}" aria-label="Definition for ${esc(p.term)}">
          <option value="">— choose a definition —</option>
          ${order.map(oi => `<option value="${oi}">${esc(pairs[oi].definition)}</option>`).join("")}
        </select>
      </div>`).join("")}
    </div>
    <div class="ex-actions"><button class="btn" data-action="check-exercise">Check answer</button></div>
    <div class="ex-feedback" hidden></div>
  </div>`;
}

function normalizeAccepted(answer, blanks){
  if (blanks > 1){
    if (Array.isArray(answer) && answer.length && Array.isArray(answer[0])) return answer;
    return [Array.isArray(answer) ? answer : [answer]];
  }
  if (Array.isArray(answer) && answer.length && Array.isArray(answer[0])) return answer;
  return [Array.isArray(answer) ? answer : [answer]];
}

function feedback(card, cls, html){
  const fb = card.querySelector(".ex-feedback");
  if (!fb) return;
  fb.hidden = false;
  fb.className = "ex-feedback " + cls;
  fb.innerHTML = html;
}

function checkExercise(card){
  const i = Number(card.dataset.ex);
  const bank = card.dataset.bank === "vocabulary" ? "vocabulary" : "grammar";
  const exercises = bank === "vocabulary"
    ? getVocabExercisesFor(state.currentTopicId)
    : getExercisesFor(state.currentTopicId);

  if (!exercises[i]) return;
  const ex = exercises[i];
  const type = card.dataset.type;

  if (type === "multiple_choice"){
    const opts = [...card.querySelectorAll(".option")];
    const selected = opts.findIndex(o => o.classList.contains("selected"));
    if (selected < 0){ feedback(card, "warn", "Choose an answer first."); return; }

    let correct = ex.answer;
    if (typeof correct === "string"){
      correct = (ex.options || []).findIndex(o => norm(o) === norm(ex.answer));
    }
    correct = Number(correct);

    opts.forEach((o, oi) => {
      o.classList.add("locked");
      if (oi === correct) o.classList.add("correct");
      else if (oi === selected) o.classList.add("wrong");
    });

    const ok = selected === correct;
    const correctText = (ex.options && ex.options[correct] != null) ? esc(ex.options[correct]) : "—";
    feedback(card, ok ? "ok" : "err",
      (ok ? "✓ Correct. " : "✗ Not quite. The correct answer is: <strong>" + correctText + "</strong>. ")
      + (ex.explanation ? esc(ex.explanation) : ""));
    return;
  }

  if (type === "fill_blank"){
    const inputs = [...card.querySelectorAll(".blank-input")];
    const accepted = normalizeAccepted(ex.answer, inputs.length);
    let allOk = true;

    inputs.forEach((inp, bi) => {
      const value = norm(inp.value);
      const list = accepted[bi] || [];
      const ok = value.length > 0 && list.some(a => norm(a) === value);
      inp.classList.toggle("correct", ok);
      inp.classList.toggle("wrong", !ok);
      inp.disabled = true;
      if (!ok) allOk = false;
    });

    const answersText = accepted.map(a => a[0]).filter(Boolean).join(" / ");
    feedback(card, allOk ? "ok" : "err",
      (allOk ? "✓ Correct. " : "✗ Not quite. Suggested answer: <strong>" + esc(answersText) + "</strong>. ")
      + (ex.explanation ? esc(ex.explanation) : ""));
    return;
  }

  if (type === "matching_definition"){
    const selects = [...card.querySelectorAll(".match-select")];
    const pairs = ex.pairs || [];
    let allOk = true;
    const wrongList = [];

    selects.forEach((sel, pi) => {
      const ok = sel.value !== "" && Number(sel.value) === pi;
      sel.classList.add(ok ? "correct" : "wrong");
      sel.disabled = true;
      if (!ok){
        allOk = false;
        wrongList.push(`<strong>${esc(pairs[pi].term)}</strong> → ${esc(pairs[pi].definition)}`);
      }
    });

    feedback(card, allOk ? "ok" : "err",
      allOk
        ? "✓ All matches are correct."
        : "✗ Some matches are wrong. Correct matches:<br>" + wrongList.join("<br>"));
    return;
  }
}

function readImageFile(file, maxW, quality){
  maxW = maxW || 700;
  quality = quality || 0.82;
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("Could not read the image file."));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("That file is not a valid image."));
      img.onload = () => {
        try {
          const scale = Math.min(1, maxW / img.width);
          const w = Math.max(1, Math.round(img.width * scale));
          const h = Math.max(1, Math.round(img.height * scale));
          const canvas = document.createElement("canvas");
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext("2d");
          ctx.fillStyle = "#ffffff";
          ctx.fillRect(0, 0, w, h);
          ctx.drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL("image/jpeg", quality));
        } catch (e){
          resolve(reader.result);
        }
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

/* ---------------------------------------------------------------------------
   25. JSON IMPORT VALIDATION + APPLY
   --------------------------------------------------------------------------- */
function validateBook(obj){
  const errors = [];
  if (!obj || typeof obj !== "object") errors.push("file is not a JSON object");
  if (!Array.isArray(obj.sections)) errors.push("missing 'sections' array");
  else if (!obj.sections.length) errors.push("'sections' is empty");
  else {
    obj.sections.forEach((s, i) => {
      if (!s || typeof s !== "object") { errors.push(`section ${i + 1} is not an object`); return; }
      if (!s.id)    errors.push(`section ${i + 1} has no 'id'`);
      if (!s.title) errors.push(`section ${i + 1} has no 'title'`);
      if (!Array.isArray(s.topics)) errors.push(`section "${s.title || i + 1}" has no 'topics' array`);
      else s.topics.forEach((t, j) => {
        if (!t || typeof t !== "object") { errors.push(`topic ${j + 1} in "${s.title}" is not an object`); return; }
        if (!t.id)    errors.push(`topic ${j + 1} in "${s.title}" has no 'id'`);
        if (!t.title) errors.push(`topic ${j + 1} in "${s.title}" has no 'title'`);
      });
    });
  }
  return { ok: errors.length === 0, errors };
}

function validateExerciseList(list, label){
  const errors = [];
  list.forEach((ex, i) => {
    const at = `${label} ${i + 1}`;
    if (!ex || typeof ex !== "object"){ errors.push(`${at} is not an object`); return; }
    const t = ex.type;
    if (!t){ errors.push(`${at} has no 'type'`); return; }
    if (t === "multiple_choice"){
      if (!Array.isArray(ex.options) || ex.options.length < 2)
        errors.push(`${at}: multiple_choice needs at least 2 options`);
      if (ex.answer === undefined)
        errors.push(`${at}: multiple_choice needs 'answer'`);
    } else if (t === "fill_blank"){
      if (!ex.sentence) errors.push(`${at}: fill_blank needs 'sentence'`);
      else if (String(ex.sentence).indexOf("{{blank}}") === -1)
        errors.push(`${at}: fill_blank 'sentence' must contain {{blank}}`);
      if (ex.answer === undefined)
        errors.push(`${at}: fill_blank needs 'answer'`);
    } else if (t === "matching_definition"){
      if (!Array.isArray(ex.pairs) || ex.pairs.length < 2)
        errors.push(`${at}: matching_definition needs at least 2 pairs`);
    } else {
      errors.push(`${at}: unsupported type "${t}"`);
    }
  });
  return errors;
}

function validateWordList(list){
  const errors = [];
  list.forEach((w, i) => {
    if (!w || typeof w !== "object"){ errors.push(`word ${i + 1} is not an object`); return; }
    if (!w.term) errors.push(`word ${i + 1} has no 'term'`);
    if (!w.definition) errors.push(`word ${i + 1} has no 'definition'`);
  });
  return errors;
}

function validatePassageList(list){
  const errors = [];
  list.forEach((p, i) => {
    if (!p || typeof p !== "object"){ errors.push(`passage ${i + 1} is not an object`); return; }
    if (!p.text) errors.push(`passage ${i + 1} has no 'text'`);
    if (p.glossary && !Array.isArray(p.glossary)) errors.push(`passage ${i + 1}: 'glossary' must be an array`);
    if (p.questions && !Array.isArray(p.questions)) errors.push(`passage ${i + 1}: 'questions' must be an array`);
  });
  return errors;
}

function validateLessonBundle(obj){
  const errors = [];
  if (!isPlainObj(obj)) return { ok: false, errors: ["file is not a JSON object"] };
  if (!obj.id)    errors.push("missing 'id'");
  if (!obj.title) errors.push("missing 'title'");

  if (obj.lesson !== undefined && !isPlainObj(obj.lesson)) errors.push("'lesson' must be an object");
  if (obj.vocabulary !== undefined && !Array.isArray(obj.vocabulary) && !isPlainObj(obj.vocabulary))
    errors.push("'vocabulary' must be an object with 'words' and 'exercises'");
  if (obj.reading !== undefined && !Array.isArray(obj.reading) && !isPlainObj(obj.reading))
    errors.push("'reading' must be an object with 'passages'");
  if (errors.length) return { ok: false, errors };

  const p = splitLessonBundle(obj);
  const mustBeArray = (val, name) => {
    if (val === undefined) return false;
    if (!Array.isArray(val)){ errors.push(`'${name}' must be an array`); return false; }
    return true;
  };

  if (mustBeArray(p.sections, "lesson.sections")){
    p.sections.forEach((s, i) => { if (!s || typeof s !== "object") errors.push(`lesson section ${i + 1} is not an object`); });
  }
  mustBeArray(p.comparisons, "lesson.comparisons");
  mustBeArray(p.summary, "lesson.summary");
  if (mustBeArray(p.exercises, "lesson.exercises"))
    errors.push(...validateExerciseList(p.exercises, "lesson exercise"));
  if (mustBeArray(p.words, "vocabulary.words"))
    errors.push(...validateWordList(p.words));
  if (mustBeArray(p.vocabExercises, "vocabulary.exercises"))
    errors.push(...validateExerciseList(p.vocabExercises, "vocabulary exercise"));
  if (mustBeArray(p.passages, "reading.passages"))
    errors.push(...validatePassageList(p.passages));

  const len = (a) => Array.isArray(a) ? a.length : 0;
  const empty = !len(p.sections) && !len(p.comparisons) && !len(p.summary) && !len(p.exercises) &&
                !len(p.words) && !len(p.vocabExercises) && !len(p.passages);
  if (empty && !errors.length)
    errors.push("the file has no content — add lesson.sections, vocabulary.words, reading.passages or exercises");

  return { ok: errors.length === 0, errors };
}

function validateExerciseFile(obj){
  const errors = [];
  if (!obj || typeof obj !== "object") errors.push("file is not a JSON object");
  if (!Array.isArray(obj.exercises)) errors.push("missing 'exercises' array");
  else if (!obj.exercises.length) errors.push("'exercises' is empty");
  else errors.push(...validateExerciseList(obj.exercises, "exercise"));
  return { ok: errors.length === 0, errors };
}

function validateVocabularyFile(obj){
  const errors = [];
  if (!obj || typeof obj !== "object") errors.push("file is not a JSON object");
  if (!obj.topic_id) errors.push("missing 'topic_id'");
  if (!Array.isArray(obj.words)) errors.push("missing 'words' array");
  else if (!obj.words.length) errors.push("'words' is empty");
  else errors.push(...validateWordList(obj.words));
  return { ok: errors.length === 0, errors };
}

function validateReadingFile(obj){
  const errors = [];
  if (!obj || typeof obj !== "object") errors.push("file is not a JSON object");
  if (!obj.topic_id) errors.push("missing 'topic_id'");
  if (!Array.isArray(obj.passages)) errors.push("missing 'passages' array");
  else if (!obj.passages.length) errors.push("'passages' is empty");
  else errors.push(...validatePassageList(obj.passages));
  return { ok: errors.length === 0, errors };
}

function isVocabExerciseFile(obj){
  if (!obj || typeof obj !== "object") return false;
  if (!obj.topic_id || !Array.isArray(obj.exercises)) return false;
  return obj.kind === "vocabulary_exercises" ||
         obj.bank === "vocabulary" ||
         obj.vocabulary_exercises === true;
}

function isReadingFile(obj){
  return !!obj && typeof obj === "object" &&
         Array.isArray(obj.passages) && !!obj.topic_id;
}

/** Import one lesson bundle. */
function applyLessonBundle(obj){
  const v = validateLessonBundle(obj);
  if (!v.ok) return { ok: false, message: "Invalid lesson JSON — " + v.errors.join("; ") };

  const p = splitLessonBundle(obj);
  const id = obj.id;
  const n = (a) => Array.isArray(a) ? a.length : 0;
  const parts = [];

  const hasLessonPart = p.sections !== undefined || p.comparisons !== undefined ||
                        p.summary !== undefined || p.exercises !== undefined;
  if (hasLessonPart){
    state.lessons[id] = {
      id,
      title: obj.title,
      section: obj.section,
      number: obj.number,
      description: obj.description,
      sections:    p.sections    || [],
      comparisons: p.comparisons || [],
      summary:     p.summary     || [],
      exercises:   []          /* moved to the "lesson" set below */
    };
    saveLessons();

    /* lesson exercises become a special "lesson" set */
    if (p.exercises !== undefined){
      const existing = getExerciseSets(id, "grammar").find(s => s.id === "lesson");
      if (p.exercises && p.exercises.length){
        if (existing){
          existing.exercises = p.exercises;
          existing.addedAt = Date.now();
          saveExerciseSets();
        } else {
          ensureSetBucket(id);
          /* put it first so it appears at the front of the grid */
          state.exerciseSets[id].grammar.unshift({
            id: "lesson",
            name: "Lesson exercises",
            source: "lesson",
            exercises: p.exercises,
            addedAt: Date.now()
          });
          state.activeSetIds[id + "::grammar"] = "lesson";
          saveExerciseSets();
          saveActiveSets();
        }
      } else if (existing){
        removeExerciseSet(id, "grammar", "lesson");
      }
    }

    parts.push(`${n(p.sections)} section${n(p.sections) === 1 ? "" : "s"}`);
    if (n(p.exercises)) parts.push(`${n(p.exercises)} lesson exercise${n(p.exercises) === 1 ? "" : "s"}`);
  }

  /* vocabulary */
  if (p.words !== undefined){
    if (p.words.length){
      state.vocabulary[id] = { topic_id: id, title: (p.vocab && p.vocab.title) || ("Vocabulary — " + obj.title), words: p.words };
      parts.push(`${p.words.length} word${p.words.length === 1 ? "" : "s"}`);
    } else {
      delete state.vocabulary[id];
    }
    saveVocabulary();
  }

  /* vocabulary exercises -> vocabulary "lesson" set */
  if (p.vocabExercises !== undefined){
    const existingV = getExerciseSets(id, "vocabulary").find(s => s.id === "lesson");
    if (p.vocabExercises && p.vocabExercises.length){
      if (existingV){
        existingV.exercises = p.vocabExercises;
        existingV.addedAt = Date.now();
        saveExerciseSets();
      } else {
        ensureSetBucket(id);
        state.exerciseSets[id].vocabulary.unshift({
          id: "lesson",
          name: "Lesson vocabulary exercises",
          source: "lesson",
          exercises: p.vocabExercises,
          addedAt: Date.now()
        });
        state.activeSetIds[id + "::vocabulary"] = "lesson";
        saveExerciseSets();
        saveActiveSets();
      }
      parts.push(`${p.vocabExercises.length} vocabulary exercise${p.vocabExercises.length === 1 ? "" : "s"}`);
    } else if (existingV){
      removeExerciseSet(id, "vocabulary", "lesson");
    }
  }

  /* reading */
  if (p.passages !== undefined){
    if (p.passages.length){
      state.readings[id] = { topic_id: id, kind: "reading", title: (p.read && p.read.title) || ("Reading — " + obj.title), passages: p.passages };
      parts.push(`${p.passages.length} passage${p.passages.length === 1 ? "" : "s"}`);
    } else {
      delete state.readings[id];
    }
    saveReadings();
  }

  const known = !!findTopicAnywhere(id);
  return {
    ok: true,
    message: `Lesson "${obj.title}" imported — ${parts.join(", ")}${known ? "" : " (warning: no matching topic id)"}.`
  };
}

function applyJSON(obj){
  /* --- grammar book --- */
  if (obj && typeof obj === "object" && obj.book && Array.isArray(obj.sections)){
    const v = validateBook(obj);
    if (!v.ok) return { ok: false, message: "Invalid grammar book JSON — " + v.errors.join("; ") };

    const nb = ensureBookShape(deepClone(obj));
    const idx = state.books.findIndex(b => b.id === nb.id);
    if (idx >= 0){
      nb.cover = nb.cover || state.books[idx].cover || null;
      state.books[idx] = nb;
    } else {
      state.books.push(nb);
    }
    state.currentBookId = nb.id;
    saveBooks();
    saveCurrentBook();
    return {
      ok: true,
      message: `Book "${bookTitle(nb)}" imported — ${bookTopics(nb).length} topics` +
               (idx >= 0 ? " (replaced existing book)." : ".")
    };
  }

  /* --- lesson bundle --- */
  if (isLessonBundle(obj)){
    return applyLessonBundle(obj);
  }

  /* --- reading passages --- */
  if (isReadingFile(obj)){
    const v = validateReadingFile(obj);
    if (!v.ok) return { ok: false, message: "Invalid reading JSON — " + v.errors.join("; ") };
    state.readings[obj.topic_id] = obj;
    saveReadings();
    const known = !!findTopicAnywhere(obj.topic_id);
    const n = obj.passages.length;
    return {
      ok: true,
      message: `Reading passages for "${obj.topic_id}" imported — ${n} passage${n === 1 ? "" : "s"}${known ? "" : " (warning: no matching topic id)"}.`
    };
  }

  /* --- vocabulary exercise bank --- */
  if (isVocabExerciseFile(obj)){
    const v = validateExerciseFile(obj);
    if (!v.ok) return { ok: false, message: "Invalid vocabulary exercise JSON — " + v.errors.join("; ") };
    const topicId = obj.topic_id;
    const name = obj.title || "Imported vocabulary exercises";
    addExerciseSet(topicId, "vocabulary", {
      id: newSetId(),
      name: uniqueSetName(topicId, "vocabulary", name),
      source: "imported",
      exercises: obj.exercises,
      addedAt: Date.now()
    });
    const known = !!findTopicAnywhere(topicId);
    const n = obj.exercises.length;
    return {
      ok: true,
      message: `Vocabulary exercises for "${topicId}" imported as a new set — ${n} exercise${n === 1 ? "" : "s"}${known ? "" : " (warning: no matching topic id)"}.`
    };
  }

  /* --- grammar exercise bank --- */
  if (obj && typeof obj === "object" && Array.isArray(obj.exercises)){
    const v = validateExerciseFile(obj);
    if (!v.ok) return { ok: false, message: "Invalid exercise JSON — " + v.errors.join("; ") };
    const topicId = obj.topic_id || "";
    const name = obj.title || "Imported exercises";
    addExerciseSet(topicId, "grammar", {
      id: newSetId(),
      name: uniqueSetName(topicId, "grammar", name),
      source: "imported",
      exercises: obj.exercises,
      addedAt: Date.now()
    });
    const known = !!findTopicAnywhere(topicId);
    const n = obj.exercises.length;
    return {
      ok: true,
      message: `Exercises for "${topicId}" imported as a new set — ${n} exercise${n === 1 ? "" : "s"}${known ? "" : " (warning: no matching topic id)"}.`
    };
  }

  /* --- vocabulary bank (single file) --- */
  if (obj && typeof obj === "object" && obj.topic_id && Array.isArray(obj.words)){
    const v = validateVocabularyFile(obj);
    if (!v.ok) return { ok: false, message: "Invalid vocabulary JSON — " + v.errors.join("; ") };
    state.vocabulary[obj.topic_id] = obj;
    saveVocabulary();
    const known = !!findTopicAnywhere(obj.topic_id);
    const n = obj.words.length;
    return {
      ok: true,
      message: `Vocabulary for "${obj.topic_id}" imported — ${n} word${n === 1 ? "" : "s"}${known ? "" : " (warning: no matching topic id)"}.`
    };
  }

  /* --- library / all-data backup --- */
  if (looksLikeLibrary(obj)){
    return applyLibrary(obj);
  }

  return {
    ok: false,
    message: "Unrecognised JSON. Expected a lesson bundle ({ id, title, lesson, vocabulary, reading }), " +
             "a grammar book ({ book, sections }) or a library / all-data backup. " +
             "For an exercise set, a bare array or { topic_id, exercises } / { topic_id, words } also works."
  };
}

function looksLikeLibrary(obj){
  if (!obj || typeof obj !== "object") return false;
  if (Array.isArray(obj)) return true;
  if (obj.book && Array.isArray(obj.sections)) return false;
  if ("books" in obj || "lessons" in obj || "exerciseSets" in obj ||
      "exercises" in obj || "vocabExercises" in obj ||
      "vocabulary" in obj || "readings" in obj ||
      "vocabBank" in obj ||
      "progress" in obj || "theme" in obj || "reader" in obj || "prefs" in obj) return true;
  return false;
}

function validateLibraryFile(obj){
  const errors = [];

  if (Array.isArray(obj)){
    if (!obj.length) errors.push("the book array is empty");
    else obj.forEach((b, i) => {
      if (!b || typeof b !== "object" || !Array.isArray(b.sections))
        errors.push(`book ${i + 1} is not a valid book object`);
    });
    return { ok: errors.length === 0, errors };
  }

  if (!obj || typeof obj !== "object"){
    errors.push("file is not a JSON object");
    return { ok: false, errors };
  }

  const isPlainObject = (v) => v && typeof v === "object" && !Array.isArray(v);

  if (obj.books !== undefined){
    if (!Array.isArray(obj.books)) errors.push("'books' must be an array");
    else obj.books.forEach((b, i) => {
      if (!b || typeof b !== "object" || !Array.isArray(b.sections))
        errors.push(`book ${i + 1} is not a valid book object`);
    });
  }
  if (obj.lessons        !== undefined && !isPlainObject(obj.lessons))        errors.push("'lessons' must be an object");
  if (obj.exerciseSets   !== undefined && !isPlainObject(obj.exerciseSets))   errors.push("'exerciseSets' must be an object");
  if (obj.exercises      !== undefined && !isPlainObject(obj.exercises))      errors.push("'exercises' must be an object");
  if (obj.vocabExercises !== undefined && !isPlainObject(obj.vocabExercises)) errors.push("'vocabExercises' must be an object");
  if (obj.vocabulary     !== undefined && !isPlainObject(obj.vocabulary))     errors.push("'vocabulary' must be an object");
  if (obj.readings       !== undefined && !isPlainObject(obj.readings))       errors.push("'readings' must be an object");
  if (obj.vocabBank      !== undefined && !Array.isArray(obj.vocabBank))      errors.push("'vocabBank' must be an array");
  if (obj.progress       !== undefined && !isPlainObject(obj.progress))       errors.push("'progress' must be an object");
  if (obj.theme          !== undefined && typeof obj.theme !== "string")      errors.push("'theme' must be a string");
  if (obj.reader         !== undefined && !isPlainObject(obj.reader))         errors.push("'reader' must be an object");
  if (obj.prefs          !== undefined && !isPlainObject(obj.prefs))          errors.push("'prefs' must be an object");

  const nothing =
    obj.books === undefined && obj.lessons === undefined &&
    obj.exerciseSets === undefined && obj.exercises === undefined &&
    obj.vocabExercises === undefined && obj.vocabulary === undefined &&
    obj.readings === undefined && obj.vocabBank === undefined &&
    obj.progress === undefined && obj.theme === undefined &&
    obj.reader === undefined && obj.prefs === undefined;

  if (nothing) errors.push("no recognisable data found");

  return { ok: errors.length === 0, errors };
}

function applyLibrary(obj){
  const v = validateLibraryFile(obj);
  if (!v.ok) return { ok: false, message: "Invalid library file — " + v.errors.join("; ") };

  let bookCount = 0, lessonCount = 0, setCount = 0, vocabCount = 0,
      readingCount = 0, bankCount = 0, progressCount = 0;
  let themeApplied = false, readerApplied = false, prefsApplied = false;

  /* --- books --- */
  let incomingBooks = [];
  if (Array.isArray(obj)) incomingBooks = obj;
  else if (Array.isArray(obj.books)) incomingBooks = obj.books;

  incomingBooks.forEach(raw => {
    const nb = ensureBookShape(deepClone(raw));
    const idx = state.books.findIndex(b => b.id === nb.id);
    if (idx >= 0){
      nb.cover = nb.cover || state.books[idx].cover || null;
      state.books[idx] = nb;
    } else {
      state.books.push(nb);
    }
    bookCount++;
  });

  /* --- lessons --- */
  if (obj && !Array.isArray(obj) && obj.lessons && typeof obj.lessons === "object"){
    Object.keys(obj.lessons).forEach(id => {
      const lesson = obj.lessons[id];
      if (lesson && typeof lesson === "object"){
        state.lessons[id] = lesson;
        lessonCount++;
      }
    });
    if (lessonCount) saveLessons();
  }

  /* --- exercise sets (new format) --- */
  if (obj && !Array.isArray(obj) && isPlainObj(obj.exerciseSets)){
    Object.keys(obj.exerciseSets).forEach(id => {
      const b = obj.exerciseSets[id];
      if (!isPlainObj(b)) return;
      if (!state.exerciseSets[id]) state.exerciseSets[id] = { grammar: [], vocabulary: [] };
      if (Array.isArray(b.grammar))    state.exerciseSets[id].grammar    = state.exerciseSets[id].grammar.concat(b.grammar);
      if (Array.isArray(b.vocabulary)) state.exerciseSets[id].vocabulary = state.exerciseSets[id].vocabulary.concat(b.vocabulary);
      setCount++;
    });
    if (setCount) saveExerciseSets();
  }

  /* --- legacy: exercises / vocabExercises objects -> sets --- */
  if (obj && !Array.isArray(obj) && isPlainObj(obj.exercises)){
    Object.keys(obj.exercises).forEach(id => {
      const bank = obj.exercises[id];
      if (bank && Array.isArray(bank.exercises) && bank.exercises.length){
        addExerciseSet(id, "grammar", {
          id: newSetId(),
          name: uniqueSetName(id, "grammar", bank.title || "Imported exercises"),
          source: "imported",
          exercises: bank.exercises,
          addedAt: Date.now()
        });
        setCount++;
      }
    });
  }
  if (obj && !Array.isArray(obj) && isPlainObj(obj.vocabExercises)){
    Object.keys(obj.vocabExercises).forEach(id => {
      const bank = obj.vocabExercises[id];
      if (bank && Array.isArray(bank.exercises) && bank.exercises.length){
        addExerciseSet(id, "vocabulary", {
          id: newSetId(),
          name: uniqueSetName(id, "vocabulary", bank.title || "Imported vocabulary exercises"),
          source: "imported",
          exercises: bank.exercises,
          addedAt: Date.now()
        });
        setCount++;
      }
    });
  }

  /* --- vocabulary --- */
  if (obj && !Array.isArray(obj) && obj.vocabulary && typeof obj.vocabulary === "object"){
    Object.keys(obj.vocabulary).forEach(id => {
      const bank = obj.vocabulary[id];
      if (bank && typeof bank === "object"){
        state.vocabulary[id] = bank;
        vocabCount++;
      }
    });
    if (vocabCount) saveVocabulary();
  }

  /* --- reading --- */
  if (obj && !Array.isArray(obj) && obj.readings && typeof obj.readings === "object"){
    Object.keys(obj.readings).forEach(id => {
      const bank = obj.readings[id];
      if (bank && typeof bank === "object"){
        state.readings[id] = bank;
        readingCount++;
      }
    });
    if (readingCount) saveReadings();
  }

  /* --- vocabulary bank --- */
  if (obj && !Array.isArray(obj) && Array.isArray(obj.vocabBank)){
    const r = addWordsToBank(obj.vocabBank, "");
    bankCount = r.added;
  }

  /* --- progress --- */
  if (obj && !Array.isArray(obj) && obj.progress && typeof obj.progress === "object"){
    Object.keys(obj.progress).forEach(id => {
      const p = obj.progress[id];
      if (p && typeof p === "object"){
        state.progress[id] = p;
        progressCount++;
      }
    });
    if (progressCount) saveProgress();
  }

  /* --- theme --- */
  if (obj && !Array.isArray(obj) && typeof obj.theme === "string" &&
      THEMES.indexOf(obj.theme) !== -1){
    state.theme = obj.theme;
    saveTheme();
    applyTheme();
    themeApplied = true;
  }

  /* --- reader --- */
  if (obj && !Array.isArray(obj) && obj.reader && typeof obj.reader === "object"){
    let changed = false;
    if (typeof obj.reader.fontId === "string" &&
        READER_FONTS.some(f => f.id === obj.reader.fontId)){
      state.reader.fontId = obj.reader.fontId;
      changed = true;
    }
    if (typeof obj.reader.size === "number" &&
        obj.reader.size >= READER_MIN && obj.reader.size <= READER_MAX){
      state.reader.size = Math.round(obj.reader.size);
      changed = true;
    }
    if (changed){
      saveReader();
      readerApplied = true;
    }
  }

  /* --- display prefs --- */
  if (obj && !Array.isArray(obj) && obj.prefs && typeof obj.prefs === "object"){
    if (typeof obj.prefs.hideGrammarExercises === "boolean" ||
        typeof obj.prefs.hideVocabExercises === "boolean"){
      state.prefs.hideGrammarExercises = !!obj.prefs.hideGrammarExercises;
      state.prefs.hideVocabExercises   = !!obj.prefs.hideVocabExercises;
      savePrefs();
      prefsApplied = true;
    }
  }

  if (bookCount){
    saveBooks();
    if (!state.currentBookId && state.books.length){
      state.currentBookId = state.books[0].id;
      saveCurrentBook();
    }
  }

  const parts = [];
  if (bookCount)     parts.push(`${bookCount} book${bookCount === 1 ? "" : "s"}`);
  if (lessonCount)   parts.push(`${lessonCount} lesson${lessonCount === 1 ? "" : "s"}`);
  if (setCount)      parts.push(`${setCount} exercise set${setCount === 1 ? "" : "s"}`);
  if (vocabCount)    parts.push(`${vocabCount} vocabulary bank${vocabCount === 1 ? "" : "s"}`);
  if (readingCount)  parts.push(`${readingCount} reading bank${readingCount === 1 ? "" : "s"}`);
  if (bankCount)     parts.push(`${bankCount} new word${bankCount === 1 ? "" : "s"} in the Vocabulary Bank`);
  if (progressCount) parts.push(`${progressCount} progress entr${progressCount === 1 ? "y" : "ies"}`);
  if (themeApplied)  parts.push("theme");
  if (readerApplied) parts.push("reading options");
  if (prefsApplied)  parts.push("display preferences");

  return {
    ok: true,
    message: parts.length
      ? "Data imported — " + parts.join(", ") + "."
      : "File contained no data to import."
  };
}

function exportAllData(){

async function handleFiles(fileList){
  const files = [...fileList];
  if (!files.length) return;
  const messages = [];

  for (const file of files){
    try {
      const text = await file.text();
      let obj;
      try { obj = JSON.parse(text); }
      catch (e){ messages.push({ type: "error", text: `${file.name}: not valid JSON — ${e.message}` }); continue; }

      const result = applyJSON(obj);
      messages.push({ type: result.ok ? "ok" : "error", text: `${file.name}: ${result.message}` });
    } catch (e){
      messages.push({ type: "error", text: `${file.name}: ${e.message}` });
    }
  }

  state.importMessages = messages;

  if (state.view === "settings"){
    render();
  } else {
    const anyOk = messages.some(m => m.type === "ok");
    toast(messages.map(m => m.text).join(" | "), anyOk ? "" : "err");
    render();
  }
}

async function handleLibraryFiles(fileList){
  const files = [...fileList];
  if (!files.length) return;
  const messages = [];

  for (const file of files){
    try {
      const text = await file.text();
      let obj;
      try { obj = JSON.parse(text); }
      catch (e){ messages.push({ type: "error", text: `${file.name}: not valid JSON — ${e.message}` }); continue; }

      const result = applyLibrary(obj);
      messages.push({ type: result.ok ? "ok" : "error", text: `${file.name}: ${result.message}` });
    } catch (e){
      messages.push({ type: "error", text: `${file.name}: ${e.message}` });
    }
  }

  state.importMessages = messages;
  const anyOk = messages.some(m => m.type === "ok");

  if (state.view === "settings"){
    render();
  } else {
    toast(messages.map(m => m.text).join(" | "), anyOk ? "" : "err");
