  }
}

/* ---------------------------------------------------------------------------
   26. EVENTS
   --------------------------------------------------------------------------- */
document.addEventListener("click", (ev) => {

  const option = ev.target.closest(".option");
  if (option && !option.classList.contains("locked")){
    const card = option.closest(".exercise");
    card.querySelectorAll(".option").forEach(o => o.classList.remove("selected"));
    option.classList.add("selected");
    return;
  }

  if (ev.target.id === "modal"){ closeModal(); return; }
  if (ev.target.id === "formModal"){ closeFormModal(); return; }

  const el = ev.target.closest("[data-action]");
  if (!el) return;
  const action = el.dataset.action;

  switch (action){

    case "nav":
      ev.preventDefault && ev.preventDefault();
      go(el.dataset.view);
      break;

    case "set-theme":
      setTheme(el.dataset.theme);
      break;

    /* ---------------- BOOKS ---------------- */
    case "add-book":    openBookForm(null); break;
    case "edit-book":   openBookForm(el.dataset.id); break;
    case "delete-book": deleteBook(el.dataset.id); break;
    case "open-book":   openBook(el.dataset.id); break;
    case "upload-cover": pickCover(el.dataset.id); break;

    case "import-book": {
      const input = $("bookFileQuick");
      input.value = "";
      input.click();
      break;
    }

    case "import-library": {
      const input = $("libraryFile");
      input.value = "";
      input.click();
      break;
    }

    /* ---------------- SECTIONS / TOPICS ---------------- */
    case "add-section":     addSection(); break;
    case "rename-section":  renameSection(el.dataset.section); break;
    case "delete-section":  deleteSection(el.dataset.section); break;
    case "add-topic":       addTopic(el.dataset.section); break;
    case "edit-topic":      editTopic(el.dataset.id); break;
    case "delete-topic":    deleteTopic(el.dataset.id); break;
    case "open-topic":      openTopic(el.dataset.id); break;

    /* ---------------- FORM MODAL ---------------- */
    case "form-submit":
      if (typeof formSubmitHandler === "function") formSubmitHandler();
      break;
    case "close-form-modal": closeFormModal(); break;
    case "pick-cover":       pickCover("modal"); break;
    case "remove-cover": {
      pendingCover = null;
      const prev = $("bfCoverPreview");
      if (prev) prev.innerHTML = coverPreviewHTML(null);
      break;
    }

    /* ---------------- LESSON ---------------- */
    case "toggle-complete": {
      const id = el.dataset.id;
      const next = statusOf(id) === "completed" ? "not_started" : "completed";
      setStatus(id, next);

      const pill = $("lessonPill");
      const btn = $("lessonCompleteBtn");
      if (pill){
        pill.className = "pill " + next;
        pill.textContent = statusLabel(next);
      }
      if (btn){
        btn.className = "btn " + (next === "completed" ? "ok" : "primary");
        btn.textContent = next === "completed" ? "↺ Mark as not completed" : "✓ Mark as completed";
      }
      updateHeader();
      updateNav();
      toast(next === "completed" ? "Topic marked as completed." : "Topic marked as not completed.");
      break;
    }

    case "prev-topic": {
      const n = neighborTopics(el.dataset.id).prev;
      if (n) openTopic(n.id);
      break;
    }
    case "next-topic": {
      const n = neighborTopics(el.dataset.id).next;
      if (n) openTopic(n.id);
      break;
    }
    case "open-passage": openPassage(el.dataset.key); break;
    case "close-modal":  closeModal(); break;

    case "check-exercise": {
      const card = el.closest(".exercise");
      if (card) checkExercise(card);
      break;
    }

    case "reveal-answer": {
      const q = el.closest(".reading-q");
      if (!q) break;
      const on = q.classList.toggle("revealed");
      el.textContent = on ? "Hide answer" : "Show answer";
      break;
    }

    /* ---------------- HIDE / SHOW BLOCKS ---------------- */
    case "toggle-block": {
      const kind = el.dataset.block;
      const body = $(el.dataset.target);
      if (!body) break;
      const nowHidden = !body.hidden;
      body.hidden = nowHidden;

      if (kind === "grammar-exercises")      state.prefs.hideGrammarExercises = nowHidden;
      else if (kind === "vocab-exercises")   state.prefs.hideVocabExercises = nowHidden;
      savePrefs();

      el.textContent = nowHidden ? "▸ Show" : "▾ Hide";
      el.setAttribute("aria-expanded", String(!nowHidden));

      const blockLabel = kind === "vocab-exercises" ? "Vocabulary exercises"
                       : kind === "reading"         ? "Reading"
                       : "Grammar exercises";
      toast(blockLabel + (nowHidden ? " hidden." : " shown."));
      break;
    }

    /* ---------------- EXERCISE SETS — select / delete ---------------- */
    case "select-ex-set": {
      const topicId = el.dataset.topic;
      const kind = el.dataset.kind === "vocabulary" ? "vocabulary" : "grammar";
      const setId = el.dataset.set;
      setActiveSetId(topicId, kind, setId);
      render();
      break;
    }

    case "delete-ex-set": {
      const topicId = el.dataset.topic;
      const kind = el.dataset.kind === "vocabulary" ? "vocabulary" : "grammar";
      const setId = el.dataset.set;
      const set = getSetById(topicId, kind, setId);
      if (!set) break;
      const n = Array.isArray(set.exercises) ? set.exercises.length : 0;
      if (!confirm(`Delete the set "${set.name}" (${n} exercise${n === 1 ? "" : "s"})?`)) break;
      removeExerciseSet(topicId, kind, setId);
      render();
      toast("Exercise set deleted.");
      break;
    }

    /* ---------------- VOCABULARY SELECTION ---------------- */
    case "vocab-select-all": {
      const topicId = el.dataset.topic;
      const grid = document.getElementById("vocab-grid-" + slugify(topicId));
      if (!grid) break;
      const on = !!el.checked;
      grid.querySelectorAll(".vocab-check").forEach(cb => { cb.checked = on; });
      break;
    }

    /* ---------------- VOCABULARY BANK — add from a lesson ---------------- */
    case "bank-add-all": {
      const topicId = el.dataset.topic;
      const words = getVocabularyFor(topicId);
      if (!words.length){ toast("There is no vocabulary to add for this topic.", "err"); break; }
      const r = addWordsToBank(words, topicId);
      updateNav();
      toast(bankAddMessage(r));
      break;
    }

    case "bank-add-selected": {
      const topicId = el.dataset.topic;
      const words = selectedVocabWords(topicId);
      if (!words.length){ toast("Tick at least one word first.", "err"); break; }
      const r = addWordsToBank(words, topicId);
      updateNav();
      toast(bankAddMessage(r));
      break;
    }

    case "bank-export-all": {
      const topicId = el.dataset.topic;
      const words = getVocabularyFor(topicId);
      if (!words.length){ toast("There is no vocabulary to export for this topic.", "err"); break; }
      downloadCSV(wordsToCSV(words), slugify(topicId) + "-vocabulary.csv");
      toast(`Exported ${words.length} word${words.length === 1 ? "" : "s"} as CSV.`);
      break;
    }

    case "bank-export-selected": {
      const topicId = el.dataset.topic;
      const words = selectedVocabWords(topicId);
      if (!words.length){ toast("Tick at least one word first.", "err"); break; }
      downloadCSV(wordsToCSV(words), slugify(topicId) + "-vocabulary-selected.csv");
      toast(`Exported ${words.length} selected word${words.length === 1 ? "" : "s"} as CSV.`);
      break;
    }

    case "bank-remove": {
      const key = el.dataset.key;
      const before = state.vocabBank.length;
      state.vocabBank = state.vocabBank.filter(w => vocabBankKey(w) !== key);
      if (state.vocabBank.length === before) break;
      saveVocabBank();
      updateNav();
      if (state.view === "vocab-bank") render();
      else { updateBankCountLabel(); renderBankResults(); }
      toast("Word removed from the Vocabulary Bank.");
      break;
    }

    case "bank-clear-filters": {
      state.vocabBankQuery = "";
      state.vocabBankFilters.source = "";
      state.vocabBankFilters.category = "";
      if (state.view === "vocab-bank") render();
      break;
    }

    case "bank-export-csv": {
      if (!state.vocabBank.length){ toast("The Vocabulary Bank is empty.", "err"); break; }
      downloadCSV(wordsToCSV(state.vocabBank), "vocabulary-bank.csv");
      toast(`Exported ${state.vocabBank.length} word${state.vocabBank.length === 1 ? "" : "s"} as CSV.`);
      break;
    }

    case "bank-export-filtered-csv": {
      const list = filteredBankWords();
      if (!list.length){ toast("Nothing to export.", "err"); break; }
      downloadCSV(wordsToCSV(list), "vocabulary-bank-selection.csv");
      toast(`Exported ${list.length} word${list.length === 1 ? "" : "s"} as CSV.`);
      break;
    }

    case "bank-export-txt": {
      if (!state.vocabBank.length){ toast("The Vocabulary Bank is empty.", "err"); break; }
      const lines = state.vocabBank.map(w => {
        const parts = [w.term];
        if (w.part_of_speech) parts.push(`(${w.part_of_speech})`);
        if (w.pronunciation)  parts.push(w.pronunciation);
        let line = parts.join(" ");
        if (w.definition) line += " — " + w.definition;
        if (w.example)    line += `\n    e.g. ${w.example}`;
        return line;
      });
      const blob = new Blob([lines.join("\n\n")], { type: "text/plain;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "vocabulary-bank.txt";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      toast(`Exported ${state.vocabBank.length} word${state.vocabBank.length === 1 ? "" : "s"} as plain text.`);
      break;
    }

    case "bank-clear": {
      if (!state.vocabBank.length){ toast("The Vocabulary Bank is already empty."); break; }
      if (!confirm(`Remove all ${state.vocabBank.length} word(s) from the Vocabulary Bank?\n\nThis does not affect the vocabulary of the lessons themselves.`)) return;
      state.vocabBank = [];
      saveVocabBank();
      updateNav();
      render();
      toast("Vocabulary Bank cleared.");
      break;
    }

    /* ---------------- READING OPTIONS ---------------- */
    case "toggle-reader": {
      state.readerOpen = !state.readerOpen;
      const panel = document.querySelector(".lesson .reader-panel");
      if (panel) panel.hidden = !state.readerOpen;
      el.textContent = "Aa " + (state.readerOpen ? "Hide options" : "Reading options");
      break;
    }
    case "set-reader-font": setReaderFont(el.dataset.font); break;
    case "reader-size-step": {
      const step = Number(el.dataset.step) || 0;
      setReaderSize(state.reader.size + step, true);
      break;
    }
    case "reset-reader": {
      state.reader.fontId = DEFAULT_READER.fontId;
      state.reader.size = DEFAULT_READER.size;
      saveReader();
      applyReader();
      toast("Reading options reset.");
      break;
    }

    /* ---------------- TEMPLATES ---------------- */
    case "download-template": {
      const kind = el.dataset.kind;
      const id = el.dataset.id;
      if (kind === "book"){
        downloadJSON(GRAMMAR_BOOK_TEMPLATE, "grammar-book.template.json");
        toast("Grammar book template downloaded.");
      } else if (kind === "lesson"){
        const tpl = id ? lessonTemplateForTopic(id) : LESSON_TEMPLATE;
        const filename = (id ? id : "lesson") + ".template.json";
        downloadJSON(tpl, filename);
        toast("Lesson template downloaded" + (id ? " for " + id : "") + ".");
      }
      break;
    }

    case "toggle-template": {
      const target = $(el.dataset.target);
      if (!target) break;
      const isHidden = target.hidden;
      target.hidden = !isHidden;
      const showLabel = el.dataset.labelShow || "▸ Show structure";
      const hideLabel = el.dataset.labelHide || "▾ Hide structure";
      el.textContent = isHidden ? hideLabel : showLabel;
      break;
    }

    case "toggle-paste": {
      const target = $(el.dataset.target);
      if (!target) break;
      const isHidden = target.hidden;
      target.hidden = !isHidden;
      const showLabel = el.dataset.labelShow || "⌨ Paste JSON text";
      const hideLabel = el.dataset.labelHide || "▾ Hide paste box";
      el.textContent = isHidden ? hideLabel : showLabel;
      if (isHidden){
        const area = target.querySelector("textarea");
        if (area) area.focus();
      }
      break;
    }

    case "import-lesson-paste": {
      const topicId = el.dataset.topic;
      const area = $(el.dataset.target);
      if (!area || !area.value.trim()){
        toast("Nothing to import — the text area is empty.", "err");
        break;
      }
      let obj;
      try { obj = JSON.parse(area.value); }
      catch (e){
        toast("Pasted text is not valid JSON — " + e.message, "err");
        break;
      }
      if (isPlainObj(obj) && !obj.book && !obj.topic_id){
        const f = findTopicAnywhere(topicId);
        if (!obj.id)    obj.id = topicId;
        if (!obj.title) obj.title = (f && f.topic.title) || topicId;
      }
      const result = applyJSON(obj);
      if (result.ok) area.value = "";
      toast(result.message, result.ok ? "" : "err");
      render();
      break;
    }

    case "copy-template": {
      const target = $(el.dataset.target);
      if (!target){ toast("Template not found.", "err"); break; }
      const text = target.textContent || "";

      const succeed = () => toast("Template JSON copied to clipboard.");
      const fail = () => toast("Could not copy automatically — select the text and copy it manually.", "err");

      if (navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(succeed).catch(() => {
          try {
            const r = document.createRange();
            r.selectNodeContents(target);
            const sel = window.getSelection();
            sel.removeAllRanges();
            sel.addRange(r);
            document.execCommand("copy");
            sel.removeAllRanges();
            succeed();
          } catch (e){ fail(); }
        });
      } else {
        try {
          const r = document.createRange();
          r.selectNodeContents(target);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(r);
          document.execCommand("copy");
          sel.removeAllRanges();
          succeed();
        } catch (e){ fail(); }
      }
      break;
    }

    case "export-lesson": {
      const id = el.dataset.id;
      if (!hasTopicContent(id)){ toast("Nothing loaded for this topic.", "err"); break; }
      downloadJSON(buildLessonBundle(id), id + ".json");
      toast("Lesson exported as a single JSON file.");
      break;
    }

    case "clear-vocabulary": {
      const id = el.dataset.id;
      if (!confirm("Remove the imported vocabulary for this topic?")) return;
      delete state.vocabulary[id];
      saveVocabulary();
      toast("Vocabulary removed.");
      render();
      break;
    }

    case "clear-reading": {
      const id = el.dataset.id;
      if (!confirm("Remove the imported reading passages for this topic?")) return;
      delete state.readings[id];
      saveReadings();
      toast("Reading passages removed.");
      render();
      break;
    }

    case "import-paste": {
      const area = $("pasteArea");
      if (!area || !area.value.trim()){ toast("Nothing to import — the text area is empty.", "err"); return; }
      let obj;
      try { obj = JSON.parse(area.value); }
      catch (e){
        state.importMessages = [{ type: "error", text: "Pasted text is not valid JSON — " + e.message }];
        render();
        return;
      }
      const result = applyJSON(obj);
      state.importMessages = [{ type: result.ok ? "ok" : "error", text: result.message }];
      render();
      break;
    }

    case "reset-progress": {
      if (!confirm("Reset all progress? This cannot be undone.")) return;
      state.progress = {};
      saveProgress();
      state.importMessages = [{ type: "ok", text: "All progress has been reset." }];
      render();
      break;
    }

    /* ---------------- EXPORT ---------------- */
    case "export-all": exportAllData(); break;

    case "export-library": {
      downloadJSON({
        exportedAt: new Date().toISOString(),
        books: state.books,
        lessons: state.lessons,
        exerciseSets: state.exerciseSets,
        vocabulary: state.vocabulary,
        readings: state.readings,
        vocabBank: state.vocabBank,
        progress: state.progress
      }, "grammar-library.json");
      toast("Library exported — books, lessons, exercise sets, vocabulary, reading passages, the vocabulary bank and progress.");
      break;
    }

    case "clear-all": {
      if (!confirm("Clear all data? This removes every book, all lessons, all exercise sets, vocabulary, vocabulary-bank and reading data and all progress. Theme, reading options and display preferences are kept.")) return;
      state.books = [];
      state.currentBookId = null;
      state.lessons = {};
      state.exerciseSets = {};
      state.activeSetIds = {};
      state.vocabulary = {};
      state.readings = {};
      state.vocabBank = [];
      state.vocabBankQuery = "";
      state.vocabBankFilters = { source: "", category: "" };
      state.progress = {};
      state.currentTopicId = null;
      try {
        localStorage.removeItem(LS.BOOKS);
        localStorage.removeItem(LS.BOOK);
        localStorage.removeItem(LS.CURRENT);
        localStorage.removeItem(LS.LESSONS);
        localStorage.removeItem(LS.EXERCISES);
        localStorage.removeItem(LS.VOCAB_EXERCISES);
        localStorage.removeItem(LS.EXERCISE_SETS);
        localStorage.removeItem(LS.ACTIVE_SETS);
        localStorage.removeItem(LS.VOCABULARY);
        localStorage.removeItem(LS.READING);
        localStorage.removeItem(LS.VOCAB_BANK);
        localStorage.removeItem(LS.PROGRESS);
      } catch (e){}
      state.importMessages = [{ type: "ok", text: "All data cleared. Create or import a book to begin." }];
      state.view = "settings";
      render();
      break;
    }

    case "export-progress": {
      const data = {
        exportedAt: new Date().toISOString(),
        progress: state.progress,
        totals: progressStats()
      };
      downloadJSON(data, "grammar-progress.json");
      break;
    }
  }
});

/* keyboard */
document.addEventListener("keydown", (ev) => {
  if (ev.key === "Escape"){
    if (!$("formModal").hidden){ closeFormModal(); return; }
    if (!$("modal").hidden){ closeModal(); return; }
  }
  if (ev.key === "Enter" || ev.key === " "){
    /* topic card */
    const card = ev.target.closest && ev.target.closest(".topic-card");
    if (card && ev.target === card){
      ev.preventDefault();
      openTopic(card.dataset.id);
      return;
    }
    /* exercise set card */
    const setCard = ev.target.closest && ev.target.closest(".ex-set-card");
    if (setCard && ev.target === setCard){
      ev.preventDefault();
      setActiveSetId(setCard.dataset.topic, setCard.dataset.kind, setCard.dataset.set);
      render();
    }
  }
});

/* live search + slider */
document.addEventListener("input", (ev) => {
  const t = ev.target;

  if (t.id === "searchInput"){
    state.query = t.value;
    renderBookResults();
    return;
  }
  if (t.id === "bankSearchInput"){
    state.vocabBankQuery = t.value;
    renderBankResults();
    return;
  }
  if (t.classList && t.classList.contains("size-slider")){
    setReaderSize(Number(t.value), false);
  }
});

/* change events */
document.addEventListener("change", (ev) => {
  const t = ev.target;
  if (!t) return;

  if (t.dataset && t.dataset.action === "pref-toggle"){
    const pref = t.dataset.pref;
    if (pref === "hideGrammarExercises" || pref === "hideVocabExercises"){
      state.prefs[pref] = !!t.checked;
      savePrefs();
      render();
    }
    return;
  }

  if (t.dataset && t.dataset.action === "vocab-select-all"){
    return;
  }

  if (t.id === "bankFilterSource"){
    state.vocabBankFilters.source = t.value;
    renderBankResults();
    return;
  }
  if (t.id === "bankFilterCategory"){
    state.vocabBankFilters.category = t.value;
    renderBankResults();
    return;
  }

  if (t.classList && t.classList.contains("size-slider")){
    setReaderSize(Number(t.value), true);
    return;
  }

  if (t.id === "coverInput"){
    const file = t.files && t.files[0];
    const target = t.dataset.target;
    t.value = "";
    if (!file) return;

    readImageFile(file).then(dataUrl => {
      if (target === "modal"){
        pendingCover = dataUrl;
        const prev = $("bfCoverPreview");
        if (prev) prev.innerHTML = coverPreviewHTML(dataUrl);
      } else if (target){
        const b = state.books.find(x => x.id === target);
        if (b){
          b.cover = dataUrl;
          saveBooks();
          render();
          toast("Cover updated.");
        }
      }
    }).catch(err => toast(err.message || "Could not read that image.", "err"));
    return;
  }

  if (t.id === "bookFileQuick"){
    const files = t.files;
    t.value = "";
    handleFiles(files);
    return;
  }

  if (t.id === "libraryFile"){
    const files = t.files;
    t.value = "";
    handleLibraryFiles(files);
    return;
  }

  if (t.id === "bookFile" || t.id === "lessonFile"){
    const files = t.files;
    t.value = "";
    handleFiles(files);
    return;
  }

  if (t.classList && t.classList.contains("lesson-file-input")){
    const files = t.files;
    t.value = "";
    handleFiles(files);
    return;
  }

  /* per-block exercise set import (multiple files, each becomes a set) */
  if (t.classList && t.classList.contains("ex-file-input")){
    const files = t.files;
    const topicId = t.dataset.topic;
    const kind = t.dataset.kind === "vocabulary" ? "vocabulary" : "grammar";
    t.value = "";
    handleExerciseFiles(files, topicId, kind);
    return;
  }
});

/* ---------------------------------------------------------------------------
   27. DYNAMIC INPUT BINDING
   --------------------------------------------------------------------------- */
function bindDynamicInputs(){
  if (state.view === "book-detail" && hasBook()){
    renderBookResults();
    const input = $("searchInput");
    if (input){
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter"){
          const first = document.querySelector(".topic-card");
          if (first) openTopic(first.dataset.id);
        }
      });
    }
  }

  if (state.view === "vocab-bank"){
    renderBankResults();
    const input = $("bankSearchInput");
    if (input){
      input.addEventListener("keydown", (e) => {
        if (e.key === "Escape"){
          input.value = "";
          state.vocabBankQuery = "";
          renderBankResults();
        }
      });
    }
  }
}

/* ---------------------------------------------------------------------------
   28. INIT
   --------------------------------------------------------------------------- */
(function init(){
  loadState();
  applyTheme();

  if (window.matchMedia){
    try {
      window.matchMedia("(prefers-color-scheme: dark)")
        .addEventListener("change", () => {
          if (state.theme === "system") applyTheme();
        });
    } catch (e){}
  }

  render();
})();
</script>
